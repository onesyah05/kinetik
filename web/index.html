<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetik</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230c1428'/><rect x='7' y='7' width='18' height='18' rx='4' fill='none' stroke='%23e8ecf6' stroke-width='2.4'/><circle cx='20' cy='12' r='2.6' fill='%23ff7a45'/></svg>" />
  </head>
  <body style="margin:0;background:#080d1a">
    <div id="root"><div style="padding:40px;text-align:center;color:#7884a0;font-family:system-ui,sans-serif">Loading Kinetik</div></div>
    <script>
      // If the app never starts (a file failed to load), say so instead of staying blank.
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && r.textContent.indexOf('Loading Kinetik') >= 0)
          r.innerHTML = '<div style="padding:40px;text-align:center;color:#ffb4a0;font:14px system-ui,sans-serif">Kinetik could not start: ' +
            String((e && (e.message || (e.target && e.target.src))) || 'a file failed to load').replace(/</g, '&lt;') +
            '<br><br><a href="" style="color:#ff7a45">Reload</a></div>';
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
